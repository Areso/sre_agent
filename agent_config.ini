[agent]
# Choose 'sse' or 'stdio'
mcp_transport = stdio
# Used if mcp_transport = sse
#mcp_server_url = http://127.0.0.1:4747/sse
# Used if mcp_transport = stdio (Example: running a local Python or Node server)
#mcp_stdio_command = ~/Documents/git/pers/safe-ssh-mcp/.venv/bin/python ~/Documents/git/pers/safe-ssh-mcp/mcp_ssh.py --transport stdio
mcp_stdio_command = uvx safe-ssh-mcp@0.1.15 --transport stdio
#mcp_stdio_command = uvx --from ~/Documents/git/pers/safe-ssh-mcp safe-ssh-mcp --transport stdio
ollama_model = qwen3.8:27b-mlx
# Let the model reason before answering. Slower; usually unnecessary for diagnostic tool calls.
ollama_think = false
default_ssh_user = root
default_ssh_key = ~/.ssh/id_rsa_private
log_prompts = true
log_responses = true
log_tools = true
